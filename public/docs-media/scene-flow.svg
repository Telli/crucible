<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" viewBox="0 0 960 300"><title>Parts go into the renderer one time. Each frame draws a picture from a camera.</title><rect width="960" height="300" fill="#101014" rx="24"/><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#8a8a93" d="M0 0 10 5 0 10z"/></marker></defs><g><rect width="250" height="188" x="40" y="56" fill="#212121" rx="18"/><text x="66" y="96" fill="#ececec" font-size="22" font-weight="600">Parts</text><g fill="#b4b4b4" font-family="ui-monospace, Consolas, monospace" font-size="15"><text x="66" y="134">name</text><text x="66" y="162">geometry</text><text x="66" y="190">matrix</text><text x="66" y="218">material</text></g><path fill="#3e8f63" d="m212 128 26 -14 26 14v30l-26 14-26-14z"/><path fill="none" stroke="#2c6a49" stroke-width="2" d="m212 128 26 14 26-14M238 142v30"/></g><path stroke="#8a8a93" stroke-width="2.5" marker-end="url(#arrow)" d="M302 150h80"/><text x="342" y="136" fill="#8a8a93" font-size="14" text-anchor="middle">one time</text><g><rect width="220" height="188" x="394" y="56" fill="#212121" rx="18"/><text x="420" y="96" fill="#ececec" font-size="22" font-weight="600">CrucibleRenderer</text><g fill="#b4b4b4" font-size="15"><text x="420" y="134">uploads geometry</text><text x="420" y="162">and textures</text><text x="420" y="198" fill="#a6c1ff" font-family="ui-monospace, Consolas, monospace">updateParts()</text><text x="420" y="222">moves and recolors</text></g></g><path stroke="#8a8a93" stroke-width="2.5" marker-end="url(#arrow)" d="M626 150h80"/><text x="666" y="136" fill="#8a8a93" font-size="14" text-anchor="middle">each frame</text><g><rect width="202" height="188" x="718" y="56" fill="#212121" rx="18"/><text x="744" y="96" fill="#ececec" font-size="22" font-weight="600">Picture</text><text x="744" y="134" fill="#a6c1ff" font-family="ui-monospace, Consolas, monospace" font-size="15">render({ eye,</text><text x="744" y="158" fill="#a6c1ff" font-family="ui-monospace, Consolas, monospace" font-size="15">target })</text><rect width="150" height="48" x="744" y="176" fill="#2f2f2f" rx="8"/><circle cx="772" cy="200" r="12" fill="#e0a548"/><rect width="22" height="22" x="800" y="190" fill="#3e8f63" rx="4"/><circle cx="858" cy="200" r="13" fill="none" stroke="#bf3b4f" stroke-width="5"/></g></svg>