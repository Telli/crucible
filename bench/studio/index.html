<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17161a" />
    <meta name="description" content="Development page for the Crucible Studio addon." />
    <title>Crucible Studio</title>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The tokens come from a stylesheet link, which blocks the first paint, so the page never shows the browser's white. -->
    <link rel="stylesheet" href="../../src/site-tokens.css" />
    <!-- A saved Light or Dark theme is on the root before anything paints. System follows the colour scheme. The key is STUDIO_PREFERENCES_KEY. -->
    <script>
      try {
        var savedTheme = JSON.parse(localStorage.getItem('crucible-studio-preferences')).theme;
        if (savedTheme === 'dark' || savedTheme === 'light') {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {}
    </script>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--site-bg);
        color: var(--site-text);
        font-family: Inter, system-ui, sans-serif;
      }
      #studio-root {
        display: block;
        width: 100%;
        height: 100svh;
        min-height: 480px;
      }
      #studio-loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 28px;
      }
      body:has(#studio-loading)::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9;
        background: var(--site-bg);
      }
      #studio-loading .pour {
        position: relative;
        width: 120px;
        height: 96px;
        transform: translateX(70px) scale(1.5);
      }
      #studio-loading .pot {
        position: absolute;
        left: -80px;
        width: 72px;
        height: 72px;
        transform-origin: 85% 88%;
      }
      #studio-loading .mark {
        width: 72px;
        height: 72px;
      }
      #studio-loading .mark-dark {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #studio-loading .mark-light { display: none; }
        :root:not([data-theme="light"]) #studio-loading .mark-dark { display: block; }
      }
      [data-theme="dark"] #studio-loading .mark-light { display: none; }
      [data-theme="dark"] #studio-loading .mark-dark { display: block; }
      #studio-loading .stream {
        position: absolute;
        left: 2px;
        top: 24px;
        width: 16px;
        height: 66px;
        opacity: 0;
        transform-origin: 6px 0;
      }
      #studio-loading .flow {
        position: absolute;
        inset: 0;
        transform-origin: 6px 0;
        clip-path: path("M1 0H8C10 6 9.5 14 8 24C7.5 36 8 50 8 64Q8 66 6 66Q4 66 4 64C4 50 3.6 36 3.2 24C2.6 12 1 8 1 0Z");
      }
      #studio-loading .flow i {
        position: absolute;
        inset: -14px 0 0;
        background:
          repeating-linear-gradient(transparent 0, color-mix(in srgb, var(--site-text) 24%, transparent) 4px, transparent 8px, color-mix(in srgb, var(--site-bg) 30%, transparent) 11px, transparent 14px),
          var(--site-focus);
      }
      #studio-loading .pool {
        position: absolute;
        left: 0;
        top: 86px;
        width: 16px;
        height: 6px;
        opacity: 0;
        transform-origin: 50% 100%;
      }
      #studio-loading .pool::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--site-focus);
        transform-origin: 50% 100%;
      }
      #studio-loading .ripple {
        position: absolute;
        left: 0;
        top: 87px;
        width: 16px;
        height: 5px;
        border-radius: 50%;
        background: radial-gradient(closest-side, transparent 62%, var(--site-focus) 80%, transparent);
        opacity: 0;
      }
      #studio-loading .drop {
        position: absolute;
        top: 84px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--site-focus);
        opacity: 0;
      }
      #studio-loading .drop:nth-of-type(1) { left: 6px; --dx: -9px; }
      #studio-loading .drop:nth-of-type(2) { left: 8px; --dx: 10px; }
      #studio-loading .progress {
        position: absolute;
        left: 0;
        top: 92px;
        width: 120px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: color-mix(in srgb, var(--site-text) 40%, transparent);
      }
      #studio-loading .fill {
        height: 100%;
        background: var(--site-focus);
        transform: scaleX(var(--progress, 0.02));
        transform-origin: 0 50%;
        animation: studio-fill-creep 150s linear both;
      }
      #studio-loading[data-state="done"] { animation: studio-loader-fade 0.15s ease-out 0.15s both; pointer-events: none; }
      @media (prefers-reduced-motion: no-preference) {
        #studio-loading[data-state="done"] { animation-delay: 0.2s; }
        #studio-loading .pot { animation: studio-pot-tilt 0.6s var(--site-ease-out) both; }
        #studio-loading .stream { animation: studio-stream-in 0.35s var(--site-ease-out) 0.45s both; }
        #studio-loading .flow { animation: studio-stream-sway 2.2s ease-in-out infinite alternate; }
        #studio-loading .flow i { animation: studio-stream-flow 0.7s linear infinite; }
        #studio-loading .pool { animation: studio-pool-in 0.3s var(--site-ease-out) 0.8s both; }
        #studio-loading .pool::before { animation: studio-pool-pulse 1.8s ease-in-out infinite alternate; }
        #studio-loading .ripple { animation: studio-ripple 1.8s ease-out 1.1s infinite; }
        #studio-loading .drop { animation: studio-drop 1.8s ease-out infinite; }
        #studio-loading .drop:nth-of-type(1) { animation-delay: 1.3s; }
        #studio-loading .drop:nth-of-type(2) { animation-delay: 2.2s; }
        #studio-loading[data-state="done"] .pot { animation: studio-pot-right 0.2s var(--site-ease-out) both; }
        #studio-loading[data-state="done"] .stream { animation: studio-stream-out 0.2s ease-in both; }
        #studio-loading[data-state="done"] .pool { animation: studio-loader-fade 0.2s ease-out both; }
        #studio-loading[data-state="done"] :is(.drop, .ripple) { animation: none; }
      }
      @keyframes studio-fill-creep { 0% { transform: scaleX(0.02); animation-timing-function: cubic-bezier(0.1, 0.5, 0.2, 1); } 20% { transform: scaleX(0.3); } 100% { transform: scaleX(0.34); } }
      @keyframes studio-pot-tilt { from { transform: rotate(0); } to { transform: rotate(30deg); } }
      @keyframes studio-pot-right { from, 40% { transform: rotate(30deg); } to { transform: rotate(0); } }
      @keyframes studio-stream-in { from { opacity: 0; transform: scaleY(0); } to { opacity: 1; transform: scaleY(1); } }
      @keyframes studio-stream-out { from { opacity: 1; transform: scaleY(1); } 30%, to { opacity: 0; transform: scaleY(0); } }
      @keyframes studio-stream-flow { to { transform: translateY(14px); } }
      @keyframes studio-stream-sway { from { transform: scaleX(0.97); } to { transform: scaleX(1.03); } }
      @keyframes studio-pool-in { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; } }
      @keyframes studio-pool-pulse { to { transform: scale(1.15, 1.3); } }
      @keyframes studio-ripple { from { opacity: 0.7; transform: scale(0.3); } to { transform: scale(1.7, 1.9); } }
      @keyframes studio-drop { 0% { opacity: 0; transform: none; } 12% { opacity: 1; } 45% { transform: translate(calc(var(--dx) * 0.6), -9px); } 100% { opacity: 0; transform: translate(var(--dx), 2px); } }
      @keyframes studio-loader-fade { from { opacity: 1; } to { opacity: 0; } }
      #studio-loading .failure {
        display: none;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 10px;
        max-width: min(520px, 86vw);
        color: var(--site-text);
        font-size: 14px;
        line-height: 1.4;
      }
      #studio-loading .failure svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: var(--site-focus);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #studio-loading[data-state="error"] .pour { transform: none; width: 72px; }
      #studio-loading[data-state="error"] .pot { left: 0; animation: none; }
      #studio-loading[data-state="error"] :is(.stream, .pool, .ripple, .drop, .progress) { display: none; }
      #studio-loading[data-state="error"] .failure { display: grid; }
    </style>
  </head>
  <body>
    <main id="studio-root"></main>
    <div id="studio-loading" role="status" aria-label="Loading Studio">
      <div class="pour">
        <div class="stream"><div class="flow"><i></i></div></div>
        <div class="pot">
          <img class="mark mark-light" src="/brand/crucible-mark.svg" alt="" fetchpriority="high" />
          <img class="mark mark-dark" src="/brand/crucible-mark-dark.svg" alt="" loading="lazy" />
        </div>
        <div class="pool"></div>
        <b class="ripple"></b>
        <i class="drop"></i><i class="drop"></i>
        <div class="progress"><div class="fill"></div></div>
      </div>
      <div class="failure" role="alert">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
        <span data-loading-message></span>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
