<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17161a" />
    <meta name="description" content="Development page for the Crucible Studio addon." />
    <title>Crucible Studio</title>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The tokens come from a stylesheet link, which blocks the first paint, so the page never shows the browser's white. -->
    <link rel="stylesheet" href="../../src/site-tokens.css" />
    <!-- A saved Light or Dark theme is on the root before anything paints. System follows the colour scheme. The key is STUDIO_PREFERENCES_KEY. -->
    <script>
      try {
        var savedTheme = JSON.parse(localStorage.getItem('crucible-studio-preferences')).theme;
        if (savedTheme === 'dark' || savedTheme === 'light') {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {}
    </script>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--site-bg);
        color: var(--site-text);
        font-family: Inter, system-ui, sans-serif;
      }
      #studio-root {
        display: block;
        width: 100%;
        height: 100svh;
        min-height: 480px;
      }
      #studio-loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 28px;
        background: var(--site-bg);
      }
      #studio-loading .pour {
        position: relative;
        left: 40px;
        width: 120px;
        height: 96px;
      }
      #studio-loading .pot {
        position: absolute;
        left: -80px;
        width: 72px;
        height: 72px;
        transform-origin: 85% 88%;
      }
      #studio-loading .mark {
        width: 72px;
        height: 72px;
      }
      #studio-loading .mark-dark {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #studio-loading .mark-light { display: none; }
        :root:not([data-theme="light"]) #studio-loading .mark-dark { display: block; }
      }
      [data-theme="dark"] #studio-loading .mark-light { display: none; }
      [data-theme="dark"] #studio-loading .mark-dark { display: block; }
      #studio-loading .stream {
        position: absolute;
        left: 4px;
        top: 24px;
        width: 4px;
        height: 68px;
        overflow: hidden;
        border-radius: 2px;
        opacity: 0;
        transform-origin: 50% 0;
      }
      #studio-loading .stream::before {
        content: "";
        position: absolute;
        inset: -8px 0 0;
        background: repeating-linear-gradient(var(--site-focus) 0 4px, color-mix(in srgb, var(--site-focus) 82%, var(--site-bg)) 4px 8px);
      }
      #studio-loading .progress {
        position: absolute;
        top: 92px;
        width: 120px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: color-mix(in srgb, var(--site-text) 22%, transparent);
      }
      #studio-loading .fill {
        height: 100%;
        background: var(--site-focus);
        transform: scaleX(var(--progress, 0.12));
        transform-origin: 0 50%;
        transition: transform 1.6s var(--site-ease-out);
      }
      #studio-loading[data-state="done"] .fill {
        transition-duration: 0.35s;
      }
      @media (prefers-reduced-motion: no-preference) {
        #studio-loading .pot { animation: studio-pot-tilt 0.6s var(--site-ease-out) both; }
        #studio-loading .stream { animation: studio-stream-in 0.35s var(--site-ease-out) 0.45s both; }
        #studio-loading .stream::before { animation: studio-stream-flow 0.5s linear infinite; }
        #studio-loading[data-state="done"] .pot { animation: studio-pot-right 0.4s ease-in-out both; }
        #studio-loading[data-state="done"] .stream { animation: studio-stream-out 0.3s ease-in both; }
      }
      @keyframes studio-pot-tilt { from { transform: rotate(0); } to { transform: rotate(30deg); } }
      @keyframes studio-pot-right { from { transform: rotate(30deg); } to { transform: rotate(0); } }
      @keyframes studio-stream-in { from { opacity: 0; transform: scaleY(0); } to { opacity: 1; transform: scaleY(1); } }
      @keyframes studio-stream-out { from { opacity: 1; transform: scaleX(1); } to { opacity: 0; transform: scaleX(0.2); } }
      @keyframes studio-stream-flow { to { transform: translateY(8px); } }
      #studio-loading .failure {
        display: none;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 10px;
        max-width: min(520px, 86vw);
        color: var(--site-text);
        font-size: 14px;
        line-height: 1.4;
      }
      #studio-loading .failure svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: var(--site-focus);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #studio-loading[data-state="error"] .pour { left: 0; width: 72px; }
      #studio-loading[data-state="error"] .pot { left: 0; animation: none; }
      #studio-loading[data-state="error"] .stream, #studio-loading[data-state="error"] .progress { display: none; }
      #studio-loading[data-state="error"] .failure { display: grid; }
    </style>
  </head>
  <body>
    <main id="studio-root"></main>
    <div id="studio-loading" role="status" aria-label="Loading Studio">
      <div class="pour">
        <div class="stream"></div>
        <div class="pot">
          <img class="mark mark-light" src="/brand/crucible-mark.svg" alt="" fetchpriority="high" />
          <img class="mark mark-dark" src="/brand/crucible-mark-dark.svg" alt="" loading="lazy" />
        </div>
        <div class="progress"><div class="fill"></div></div>
      </div>
      <div class="failure" role="alert">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
        <span data-loading-message></span>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
